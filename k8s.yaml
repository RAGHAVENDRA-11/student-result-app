apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-result-app
  labels:
    app: student-result-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: student-result-app

  template:
    metadata:
      labels:
        app: student-result-app

    spec:
      containers:
        - name: student-result-container
          image: student-result-app:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: student-result-service

spec:
  type: NodePort

  selector:
    app: student-result-app

  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080